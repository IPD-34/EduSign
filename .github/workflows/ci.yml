name: ci

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned packages
        run: pip install pytest==8.2.2 sacrebleu==2.2.0 rouge==1.0.1 numpy==1.26.4 pandas==2.1.4 scipy==1.11.4 pyyaml==6.0.1
      - name: Run tests
        run: pytest tests/ -v
