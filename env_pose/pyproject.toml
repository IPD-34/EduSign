[project]
name = "env-pose"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy==1.26.4",
    "opencv-contrib-python==4.9.0.80",
    "onnxruntime-gpu[cuda,cudnn]==1.22.0",
    "remotezip==0.12.3",
    "requests==2.32.3",
    "pandas==2.1.4",
    "pyyaml==6.0.1",
    "tqdm==4.66.4",
    "rtmlib==0.0.16",
]

[dependency-groups]
dev = [
    "pytest==8.2.2",
    "ruff==0.5.0",
]

[tool.uv]
override-dependencies = ["opencv-python; sys_platform == 'never'"]
